<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCHIKOMI automatic WebGL capture fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9eceb; color: #24312e; font: 15px system-ui, sans-serif; }
    header { height: 60px; display: flex; gap: 18px; align-items: center; padding: 0 28px; background: #fff; }
    header strong { letter-spacing: .1em; }
    header span, p { font-size: 12px; color: #61736e; }
    main { padding: 28px; }
    canvas { display: block; width: 900px; height: 560px; max-width: 100%; }
  </style>
</head>
<body>
  <header><strong>WEBGL CAPTURE FIXTURE</strong><span>自動テスト専用の独自画面。寿司打本体・公式の出題データではありません。</span></header>
  <main>
    <canvas id="game" width="900" height="560" tabindex="0" aria-label="自動記録テスト用のWebGL画面"></canvas>
    <p>独立した文字画像を WebGL で描画。入力や記録開始の操作は不要です。</p>
  </main>
  <script>
    (async () => {
      const canvas = document.getElementById('game');
      // The QA runner substitutes local PNGs. No game assets or network images
      // are used, and the drawing surface remains origin-clean.
      const sources = {
        reading: '__UCHI_READING_PNG__',
        japanese: '__UCHI_JAPANESE_PNG__',
        roman: '__UCHI_ROMAN_PNG__',
      };
      const surface = document.createElement('canvas');
      surface.width = canvas.width; surface.height = canvas.height;
      const ctx = surface.getContext('2d');
      ctx.fillStyle = '#597763'; ctx.fillRect(0, 0, 900, 560);
      ctx.fillStyle = '#87987d'; ctx.fillRect(0, 410, 900, 150);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(150, 190, 600, 172, 16); ctx.fill();
      ctx.fillStyle = '#231f15'; ctx.beginPath(); ctx.roundRect(157, 197, 586, 158, 9); ctx.fill();
      for (const [kind, top, height] of [['reading', 207, 25], ['japanese', 240, 38], ['roman', 291, 34]]) {
        const image = new Image(); image.src = sources[kind]; await image.decode();
        const original = document.createElement('canvas');
        original.width = image.naturalWidth; original.height = image.naturalHeight;
        const originalCtx = original.getContext('2d', { willReadFrequently: true });
        originalCtx.drawImage(image, 0, 0);
        const pixels = originalCtx.getImageData(0, 0, original.width, original.height);
        let left = original.width, right = 0, first = original.height, bottom = 0;
        for (let y = 0; y < original.height; y++) for (let x = 0; x < original.width; x++) {
          const i = (y * original.width + x) * 4;
          if (Math.min(pixels.data[i], pixels.data[i + 1], pixels.data[i + 2]) < 180) {
            left = Math.min(left, x); right = Math.max(right, x);
            first = Math.min(first, y); bottom = Math.max(bottom, y);
          }
        }
        const crop = { x: left - 2, y: first - 2, width: right - left + 5, height: bottom - first + 5 };
        const line = document.createElement('canvas');
        line.width = Math.round(crop.width * height / crop.height); line.height = height;
        const lineCtx = line.getContext('2d', { willReadFrequently: true });
        lineCtx.drawImage(original, crop.x, crop.y, crop.width, crop.height, 0, 0, line.width, height);
        const linePixels = lineCtx.getImageData(0, 0, line.width, height);
        for (let i = 0; i < linePixels.data.length; i += 4) {
          const ink = (255 - Math.min(linePixels.data[i], linePixels.data[i + 1], linePixels.data[i + 2])) / 255;
          linePixels.data[i] = Math.round(35 + 220 * ink);
          linePixels.data[i + 1] = Math.round(31 + 224 * ink);
          linePixels.data[i + 2] = Math.round(21 + 234 * ink);
          linePixels.data[i + 3] = 255;
        }
        lineCtx.putImageData(linePixels, 0, 0);
        ctx.drawImage(line, Math.round((canvas.width - line.width) / 2), top);
      }

      // An independently drawn receipt exercises the real result detector and
      // OCR, not a fixture response injected into the extension. CI installs
      // this font explicitly so Japanese glyphs do not depend on fallback.
      const font = '"Noto Sans CJK JP", "Noto Sans JP", sans-serif';
      await document.fonts.load(`32px ${font}`); await document.fonts.ready;
      const receipt = document.createElement('canvas');
      receipt.width = canvas.width; receipt.height = canvas.height;
      const receiptCtx = receipt.getContext('2d');
      receiptCtx.fillStyle = '#597763'; receiptCtx.fillRect(0, 0, 900, 560);
      receiptCtx.fillStyle = '#fff'; receiptCtx.fillRect(100, 40, 700, 430);
      receiptCtx.fillStyle = '#353535'; receiptCtx.fillRect(100, 68, 700, 63);
      receiptCtx.textAlign = 'center'; receiptCtx.textBaseline = 'middle';
      receiptCtx.fillStyle = '#fff'; receiptCtx.font = `bold 30px ${font}`;
      receiptCtx.fillText('高級 10,000円コース [正確重視]', 450, 99);
      const moneyLine = (amount, label, y, coloured = false) => {
        receiptCtx.textAlign = 'left'; receiptCtx.textBaseline = 'alphabetic';
        receiptCtx.fillStyle = '#111'; receiptCtx.font = `32px ${font}`;
        receiptCtx.fillText(amount, 220, y);
        receiptCtx.fillStyle = coloured ? '#5f8f0e' : '#111'; receiptCtx.font = `27px ${font}`;
        receiptCtx.fillText(label, 370, y);
      };
      moneyLine('29,740', '円分のお寿司をゲット!', 186);
      moneyLine('10,000', '円 払って…', 248);
      receiptCtx.fillStyle = '#5f8f0e'; receiptCtx.fillRect(128, 278, 644, 70);
      receiptCtx.fillStyle = '#fff'; receiptCtx.fillRect(134, 284, 632, 58);
      moneyLine('19,740', '円分お得でした!', 326, true);
      receiptCtx.fillStyle = '#42584b'; receiptCtx.font = `22px ${font}`;
      receiptCtx.textAlign = 'center'; receiptCtx.fillText('独立したテスト用の結果画面', 450, 405);
      receiptCtx.fillStyle = '#fff'; receiptCtx.fillRect(300, 486, 300, 48);
      receiptCtx.fillStyle = '#24312e'; receiptCtx.font = `24px ${font}`;
      receiptCtx.textBaseline = 'middle'; receiptCtx.fillText('もう一度（Escキー）', 450, 510);

      const gl = canvas.getContext('webgl', { preserveDrawingBuffer: false, alpha: false, antialias: false });
      if (!gl) throw new Error('The automatic capture fixture requires WebGL');
      const compile = (type, source) => {
        const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
        return shader;
      };
      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, `
        attribute vec2 position;
        varying vec2 texturePosition;
        void main() { texturePosition = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }
      `));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform sampler2D promptTexture;
        varying vec2 texturePosition;
        void main() { gl_FragColor = texture2D(promptTexture, texturePosition); }
      `));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
      gl.useProgram(program);
      const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, 'position');
      gl.enableVertexAttribArray(position); gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      const texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, surface);
      gl.uniform1i(gl.getUniformLocation(program, 'promptTexture'), 0);
      gl.viewport(0, 0, canvas.width, canvas.height);
      let frames = 0, round = 1, state = 'prompt';
      const keyboardEvents = [];
      const setState = next => {
        state = next;
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, next === 'result' ? receipt : surface);
      };
      // Model the game's documented Escape action using ordinary DOM events.
      // Accepting synthetic events here verifies the extension's wiring only;
      // it cannot prove the official Unity build accepts them.
      for (const type of ['keydown', 'keyup']) window.addEventListener(type, event => {
        if (!['Escape', 'Enter', 'F2'].includes(event.key)) return;
        keyboardEvents.push({ type, key: event.key, code: event.code, keyCode: event.keyCode,
          which: event.which, trusted: event.isTrusted, repeat: event.repeat, shift: event.shiftKey,
          state, round, at: performance.timeOrigin + performance.now() });
        if (type === 'keydown' && event.key === 'Escape' && !event.repeat && state === 'result') {
          round++; setState('prompt');
        }
      });
      window.canvasFixture = {
        ready: true,
        contextAttributes: gl.getContextAttributes(),
        get frames() { return frames; },
        get state() { return state; },
        get round() { return round; },
        get keyboardEvents() { return keyboardEvents.map(event => ({ ...event })); },
        showResult() { setState('result'); return { round, state }; },
        resultImage() { return receipt.toDataURL('image/png'); },
      };
      const draw = () => {
        gl.disable(gl.SCISSOR_TEST); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        // Change pixels outside the prompt to require a genuinely live stream.
        gl.enable(gl.SCISSOR_TEST); gl.scissor(12, 12, 12, 12);
        gl.clearColor((frames % 60) / 60, .35, .25, 1); gl.clear(gl.COLOR_BUFFER_BIT);
        frames++; requestAnimationFrame(draw);
      };
      // No readPixels(), gl.finish(), preserved backbuffer, or product hooks.
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
