name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:ocr
      - run: npm run test:auto-ocr
      - name: Include third-party notices
        run: cp THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: uchikomi-extension
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: qa/*.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Extension UI, OCR worker and automatic region smoke tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-verification
          path: qa/
          if-no-files-found: warn
          retention-days: 14
