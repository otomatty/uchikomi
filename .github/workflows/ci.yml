name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.extension.outputs.artifact-id }}
      artifact-digest: ${{ steps.extension.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:ocr
      - run: npm run test:auto-ocr
      - id: extension
        uses: actions/upload-artifact@v7
        with:
          name: uchikomi-extension
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: qa/*.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install the Japanese fixture font and native file picker test tool
        run: sudo apt-get install -y fonts-noto-cjk xdotool python3-gi gir1.2-atspi-2.0 at-spi2-core
      - name: Verify a normal unpacked install updates on browser restart
        run: dbus-run-session -- xvfb-run -a node tests/zip-restart-check.mjs
        env:
          LANG: en_US.UTF-8
          GTK_USE_PORTAL: '0'
          GTK_A11Y: atspi
          GSETTINGS_BACKEND: memory
      - name: Extension UI, OCR worker and automatic region smoke tests
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" npm run test:browser
        env:
          DEBUG: pw:browser
          HEADLESS: '0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-verification
          path: qa/
          if-no-files-found: warn
          retention-days: 14

  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify ZIP upgrades and the Windows scheduled task
        shell: powershell
        run: ./tests/windows-zip-update.ps1

  release:
    needs: [verify, browser, windows-updater]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the verified extension ZIP
        run: bash scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
